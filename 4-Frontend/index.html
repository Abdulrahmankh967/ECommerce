<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shop everyday essentials at Northline Market.">
  <title>Home · Northline Market</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="." data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>
  <main id="main" class="container">
    <section class="hero">
      <h1>Quiet quality for everyday living</h1>
      <p class="lede">Browse curated products, save favorites, and check out with the same accounts used by our store API.</p>
      <form class="search-bar" action="products.html" method="get" role="search">
        <label class="visually-hidden" for="q">Search products</label>
        <input id="q" name="q" type="search" placeholder="Search products" autocomplete="off">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </section>
    <section id="categories-preview" class="section"></section>
    <section id="featured" class="section"></section>
  </main>
  <div id="app-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
